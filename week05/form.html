<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Share your experience with our time-travel products by submitting a product review.">
  <title>Product Review Form</title>
  <link rel="stylesheet" href="css/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form action="review.html" method="get">
      <p class="note">Fields marked with <span class="req">*</span> are required.</p>

      <div class="field">
        <label for="productName">Product Name <span class="req">*</span></label>
        <select id="productName" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="field rating">
        <legend>Overall Rating <span class="req">*</span></legend>
        <div class="stars">
          <input type="radio" id="star5" name="rating" value="5" required>
          <label for="star5" title="5 stars"><span class="sr-only">5 stars</span></label>
          <input type="radio" id="star4" name="rating" value="4">
          <label for="star4" title="4 stars"><span class="sr-only">4 stars</span></label>
          <input type="radio" id="star3" name="rating" value="3">
          <label for="star3" title="3 stars"><span class="sr-only">3 stars</span></label>
          <input type="radio" id="star2" name="rating" value="2">
          <label for="star2" title="2 stars"><span class="sr-only">2 stars</span></label>
          <input type="radio" id="star1" name="rating" value="1">
          <label for="star1" title="1 star"><span class="sr-only">1 star</span></label>
        </div>
      </fieldset>

      <div class="field">
        <label for="installDate">Date of Installation <span class="req">*</span></label>
        <input type="date" id="installDate" name="installDate" required>
      </div>

      <fieldset class="field">
        <legend>Useful Features (check all that apply)</legend>
        <div class="check">
          <input type="checkbox" id="feat-durability" name="features" value="Durability">
          <label for="feat-durability">Durability</label>
        </div>
        <div class="check">
          <input type="checkbox" id="feat-ease" name="features" value="Ease of Use">
          <label for="feat-ease">Ease of Use</label>
        </div>
        <div class="check">
          <input type="checkbox" id="feat-performance" name="features" value="Performance">
          <label for="feat-performance">Performance</label>
        </div>
        <div class="check">
          <input type="checkbox" id="feat-design" name="features" value="Design">
          <label for="feat-design">Design</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="review">Written Review</label>
        <textarea id="review" name="review" rows="5" placeholder="Tell us what you thought..."></textarea>
      </div>

      <div class="field">
        <label for="userName">Your Name</label>
        <input type="text" id="userName" name="userName" autocomplete="name" placeholder="Optional">
      </div>

      <input type="submit" value="Submit Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> | Rey Uy Lavadia | Naga City. Camarines Sur</p>
    <p>Last Modification: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
